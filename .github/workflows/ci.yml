name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # @le/shared installs from a private repo by git tag, so the runner needs
      # credentials. GITHUB_TOKEN can't read other private repos — use a PAT
      # stored as the GH_PAT secret (repo scope).
      - name: Configure git for private deps
        run: |
          git config --global url."https://${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"
      - run: npm install
      - run: npm run build
