name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # @le/shared and @le/ui-kit are public repos installed by git tag, so the
      # runner needs no credentials. Kept public deliberately: they hold types,
      # distance maths and CSS tokens, nothing secret. Making them private needs
      # a PAT, and git-over-HTTPS auth for private deps proved unreliable.
      - run: npm install

      - run: npm run build
