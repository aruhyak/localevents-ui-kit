name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # @le/shared and @le/ui-kit are public repos installed by git tag, so no
      # credentials are needed. Keeping them public is deliberate: they hold
      # types, distance maths and CSS tokens — nothing secret — and it avoids a
      # PAT that would silently expire and break CI.
      - run: npm install

      - run: npm run build
