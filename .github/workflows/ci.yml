name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Private @le/* packages install by git tag. The built-in GITHUB_TOKEN
      # cannot read OTHER private repos, so a PAT (repo scope) is required as
      # the GH_PAT secret. npm resolves `github:` shorthand to SSH, so all
      # three URL forms are rewritten to authenticated HTTPS.
      - name: Configure git for private deps
        run: |
          AUTH="https://x-access-token:${{ secrets.GH_PAT }}@github.com/"
          git config --global url."$AUTH".insteadOf "https://github.com/"
          git config --global url."$AUTH".insteadOf "ssh://git@github.com/"
          git config --global url."$AUTH".insteadOf "git@github.com:"

      - run: npm install

      - run: npm run build
